services:
  # Redis Stack：会话记忆 + 限流计数（db 1）+ RAG 向量库（db 2，需 RedisSearch 模块支持 FT.* 命令）
  # 注意：必须用 redis-stack-server（含 RedisSearch + RedisJSON），普通 redis:7-alpine 不支持向量检索
  travelmind-redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: travelmind-redis
    restart: unless-stopped
    # 不覆盖 command，保留默认 /etc/redis-stack.conf（内含 loadmodule 加载 RediSearch/RedisJSON）
    # 通过 REDIS_ARGS 追加密码与持久化参数
    environment:
      REDIS_ARGS: "--requirepass 840614 --appendonly yes"
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # 健康检查同时验证 RedisSearch 模块可用（FT._LIST 是搜索模块的标识命令）
      test: ["CMD-SHELL", "redis-cli -a 840614 ping && redis-cli -a 840614 FT._LIST >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MySQL：用户账号 + 行程落库（固定映射宿主机 3307，首次启动自动执行 init.sql 建库建表）
  travelmind-mysql:
    image: mysql:8.0
    container_name: travelmind-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: 840614
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行，用于初始化 travelmind 库及表结构
      - ./travel-java/docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p840614"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 后端：Spring Boot，仅在 compose 内部网络可见，不映射到宿主机
  travel-backend:
    build: ./travel-java
    image: travel-java-server:latest
    container_name: travel-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${LLM_API_KEY}   # 从同目录 .env 文件读取，不要把 .env 提交到 git
      # 容器内通过服务名直连基础设施（端口为容器端口，非宿主机映射端口）
      REDIS_HOST: travelmind-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "840614"
      MYSQL_HOST: travelmind-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: "840614"
    expose:
      - "3200"
    depends_on:
      travelmind-redis:
        condition: service_healthy
      travelmind-mysql:
        condition: service_healthy

  # 前端：Nginx 托管静态文件并反代 /api 到后端容器
  travel-frontend:
    build: ./travel-h5
    image: travel-h5:latest
    container_name: travel-frontend
    restart: unless-stopped
    ports:
      - "80:80"          # 若本机 80 被占用，改成 "8080:80"，访问 http://localhost:8080
    depends_on:
      - travel-backend

volumes:
  redis-data:
  mysql-data:
