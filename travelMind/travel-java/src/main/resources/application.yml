# ============================================================
# 后端服务配置文件
# ============================================================
server:
  port: 3200                    # 服务监听端口，前端请求需指向此端口

# 大模型（LLM）调用配置
# 本项目通过 SiliconFlow（硅基流动）平台的兼容 OpenAI 格式接口调用大模型
llm:
  base-url: https://api.siliconflow.cn/v1   # 平台 API 基础地址
  model: Pro/zai-org/GLM-5.1                # 使用的模型名称（需在平台上确认可用）
  api-key: ${LLM_API_KEY:}   # 从环境变量 LLM_API_KEY 读取密钥（IDEA/systemd/compose 任一处注入即可）
