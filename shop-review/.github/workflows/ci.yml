name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 先 compile（快速失败）再 package（含资源处理与 jar 打包）
      # 测试补充后可将 -DskipTests 移除
      - name: Compile
        run: mvn -B -q compile

      - name: Package
        run: mvn -B -q -DskipTests package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 验证 Dockerfile 可正常构建镜像；推送需配置 registry 密钥后加 docker/login-action
      - name: Build image
        run: docker build -t shop-review:${{ github.sha }} .
